# Bu dosya repo içinde şu yolda olmalı:  .github/workflows/daily.yml
# Klasör adları dahil birebir aynı olmalı, yoksa GitHub görmez.

name: Sabah Piyasa Botu

# TEK TETİKLEYİCİ: workflow_dispatch.
#
# Burada bilerek "schedule" yok. GitHub'ın kendi zamanlayıcısı bu repoda
# güvenilir çalışmadı - cron "50 5 * * *" (08:50 TSİ) yerinde dururken:
#     25.08.2026  hiç çalışmadı
#     26.08.2026  06:19 UTC   (30 dk geç)
#     27.08.2026  16:49 UTC   (11 saat geç, mesaj akşam 19:49'da gitti)
# GitHub schedule'ı garanti etmiyor; yoğunlukta geciktiriyor, bazen tamamen
# düşürüyor ve private repolarda önceliği daha düşük.
#
# Buna karşılık workflow_dispatch ile tetiklenen çalışmaların hepsi saniyesinde
# başladı. Bu yüzden zamanlama dışarıdan yapılıyor: cron-job.org her sabah
# 08:50 TSİ'de GitHub API'sine istek atıyor (kurulumu README'de).
on:
  workflow_dispatch:
    inputs:
      esik:
        description: "Yüzde eşiği"
        required: false
        default: "9.0"

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # takılırsa sonsuza kadar dakika yakmasın

    steps:
      # 1) Repo'yu geçici makineye kopyala
      - uses: actions/checkout@v4

      # 2) Python kur, pip önbelleğini aç (sonraki çalışmalar hızlansın)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3) Bağımlılıkları kur
      - run: pip install -r requirements.txt

      # 4) Botu çalıştır
      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Elle çalıştırıldıysa girilen değeri, zamanlanmışsa 9.0 kullan
          TAVAN_ESIK: ${{ github.event.inputs.esik || '9.0' }}
