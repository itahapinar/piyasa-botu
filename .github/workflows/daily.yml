# Bu dosya repo içinde şu yolda olmalı:  .github/workflows/daily.yml
# Klasör adları dahil birebir aynı olmalı, yoksa GitHub görmez.

name: Sabah Piyasa Botu

on:
  schedule:
    # DİKKAT: cron her zaman UTC'dir. Türkiye UTC+3 (yaz saati yok).
    # İstediğin TSİ saatinden 3 saat çıkar.
    #   08:50 TSİ -> 05:50 UTC
    # Alanlar: dakika saat ayın_günü ay haftanın_günü
    # Son alan "*" = her gün (hafta sonu dahil).
    # Sadece hafta içi istersen son alanı 1-5 yap.
    #
    # 08:50'de BIST kapalı (açılış seansı 09:40, ilk işlem ~10:00), o yüzden
    # tarama dünkü kapanışı görüyor ve liste tam geliyor.
    #
    # NEDEN :50, tam saat değil? GitHub zamanlanmış işleri kuyruğa alıyor ve
    # tam saatler (:00) en yoğun slot. 24.08.2026'da "0 6" ayarıyla iş 10:12'de
    # çalıştı - açılıştan sonra. :50 hem o yığılmadan kaçıyor hem ilk işleme
    # ~70 dakika pay bırakıyor.
    #
    # Yine de gecikirse felaket değil: bot.py hedef seansı verinin kendisinden
    # sabitliyor, rakamlar dünkü kapanışa ait kalıyor. Sadece aday listesi eksik
    # kalabilir ve mesaja bunu söyleyen bir uyarı düşer.
    - cron: "50 5 * * *"

  # Actions sekmesinden "Run workflow" ile elle tetiklemeni sağlar.
  # Test için şart; bunu koymazsan ertesi sabahı beklemek zorunda kalırsın.
  workflow_dispatch:
    inputs:
      esik:
        description: "Yüzde eşiği (elle çalıştırmada)"
        required: false
        default: "9.0"

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # takılırsa sonsuza kadar dakika yakmasın

    steps:
      # 1) Repo'yu geçici makineye kopyala
      - uses: actions/checkout@v4

      # 2) Python kur, pip önbelleğini aç (sonraki çalışmalar hızlansın)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3) Bağımlılıkları kur
      - run: pip install -r requirements.txt

      # 4) Botu çalıştır
      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Elle çalıştırıldıysa girilen değeri, zamanlanmışsa 9.0 kullan
          TAVAN_ESIK: ${{ github.event.inputs.esik || '9.0' }}
